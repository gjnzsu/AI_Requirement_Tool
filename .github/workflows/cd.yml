name: CD -- Deploy to GKE

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Shared gateway HTTP(S) origin; use the configured route hostname'
        required: true
        type: string

env:
  GCP_REGION: us-central1
  GKE_CLUSTER: helloworld-cluster
  IMAGE_NAME: ai-requirement-tool
  REGISTRY_REPO: ai-requirement-tool

jobs:
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate gateway base URL before cloud access
        env:
          REQUESTED_BASE_URL: ${{ inputs.base_url }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          value = os.environ['REQUESTED_BASE_URL']
          url = urlsplit(value)
          assert value and not any(c.isspace() or ord(c) < 32 for c in value), 'Invalid base URL'
          assert url.scheme in ('http', 'https') and url.hostname, 'HTTP(S) origin required'
          assert not url.username and not url.password, 'Credentials are not allowed'
          assert url.path in ('', '/') and not url.query and not url.fragment, 'Origin only'
          assert '?' not in value and '#' not in value, 'Query and fragment are not allowed'
          assert url.port is None or 1 <= url.port <= 65535, 'Invalid port'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"BASE_URL={value.rstrip('/')}\n")
          PY

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set image in deployment manifests
        run: |
          IMAGE_BASE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REGISTRY_REPO }}/${{ env.IMAGE_NAME }}
          FULL_IMAGE=${IMAGE_BASE}:${{ github.sha }}
          sed -i "s|IMAGE_PLACEHOLDER|${FULL_IMAGE}|g" k8s/deployment.yaml
          sed -i "s|IMAGE_PLACEHOLDER|${FULL_IMAGE}|g" k8s/celery-worker-deployment.yaml

      - name: Apply deployment manifests
        run: |
          echo "Assuming ai-tool-secrets already exists in cluster with required keys."
          kubectl apply -f k8s/redis-deployment.yaml
          kubectl apply -f k8s/redis-service.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/celery-worker-deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/prometheus-deployment.yaml
          kubectl apply -f k8s/grafana-deployment.yaml
          kubectl apply -f k8s/grafana-service.yaml
          kubectl apply -f k8s/grafana-dashboard.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/redis --timeout=120s
          kubectl rollout status deployment/ai-tool --timeout=120s
          kubectl rollout status deployment/celery-worker --timeout=120s

      - name: Verify service endpoints
        run: |
          for service in redis-service ai-tool-service; do
            READY=false
            for i in $(seq 1 6); do
              ADDRESSES=$(kubectl get endpointslice \
                --selector "kubernetes.io/service-name=${service}" \
                -o jsonpath='{.items[*].endpoints[*].addresses[*]}')
              if [ -n "$ADDRESSES" ]; then
                READY=true
                break
              fi
              sleep 5
            done
            if [ "$READY" != true ]; then
              echo "FAIL: ${service} has no endpoints"
              exit 1
            fi
          done
      - name: Smoke test -- verify app and metrics pipeline
        run: |
          echo "=== 1. Health endpoint ==="
          curl -sf "${BASE_URL}/api/health" | grep -q 'ok\|healthy\|status' \
            && echo "OK: /api/health responded" \
            || { echo "FAIL: /api/health did not respond"; exit 1; }

          echo "=== 2. Create smoke-test user ==="
          kubectl exec deploy/ai-tool -- python3 -c "import sys; sys.path.insert(0,'/app'); from src.auth.user_service import UserService; us=UserService(); u=us.get_user_by_username('smoketest'); us.update_password(u['id'],'smoketest123') if u else us.create_user('smoketest','smoketest@ci.local','smoketest123'); print('ready')"

          echo "=== 3. Login to get JWT token ==="
          TOKEN=$(curl -s -X POST "${BASE_URL}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"smoketest","password":"smoketest123"}' \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$TOKEN" ]; then
            echo "FAIL: Could not obtain auth token"
            exit 1
          fi
          echo "OK: Auth token obtained"

          echo "=== 4. Trigger a chat request to exercise LLM metrics ==="
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${BASE_URL}/api/chat" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -d '{"message":"ping","conversation_id":"smoke-test-deploy"}')
          echo "Chat endpoint returned HTTP ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FAIL: /api/chat returned ${HTTP_STATUS}"
            exit 1
          fi

          echo "=== 5. Wait for Prometheus scrape cycle (35s) ==="
          sleep 35

          echo "=== 6. Assert http_requests_total is non-zero ==="
          COUNT=$(kubectl exec deploy/prometheus -- \
            wget -qO- 'http://localhost:9090/api/v1/query?query=http_requests_total' \
            | grep -o '"result":\[.' | grep -v '\[\]' | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "FAIL: http_requests_total has no data in Prometheus"
            exit 1
          fi
          echo "OK: http_requests_total is being recorded"

          echo "=== 7. Assert llm_tokens_total is non-zero ==="
          LLM_COUNT=$(kubectl exec deploy/prometheus -- \
            wget -qO- 'http://localhost:9090/api/v1/query?query=sum(llm_tokens_total)' \
            | grep -o '"result":\[.' | grep -v '\[\]' | wc -l)
          if [ "$LLM_COUNT" -eq 0 ]; then
            echo "FAIL: llm_tokens_total has no data in Prometheus"
            exit 1
          fi
          echo "OK: llm_tokens_total is being recorded"

          echo "=== 8. Assert llm_token_cost_usd_total is non-zero ==="
          COST_COUNT=$(kubectl exec deploy/prometheus -- \
            wget -qO- 'http://localhost:9090/api/v1/query?query=sum(llm_token_cost_usd_total)' \
            | grep -o '"result":\[.' | grep -v '\[\]' | wc -l)
          if [ "$COST_COUNT" -eq 0 ]; then
            echo "FAIL: llm_token_cost_usd_total has no data in Prometheus"
            exit 1
          fi
          echo "OK: llm_token_cost_usd_total is being recorded"

          echo "=== Smoke test PASSED ==="
